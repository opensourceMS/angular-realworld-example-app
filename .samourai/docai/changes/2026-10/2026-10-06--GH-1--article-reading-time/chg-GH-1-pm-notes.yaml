decisions:
  - text: >-
      PM-decided (user asked to run full workflow without waiting): option D. Reading time is
      displayed in app-article-meta only when `article.body` is defined (not null/undefined).
      Article page (single-article endpoint returns body) -> always shown, incl. empty body -> "1 min read".
      Previews (list endpoints omit body per RealWorld API since 2024-08-16) -> hidden; shown if a
      backend still returns body. Rationale: honest data (no misleading "1 min read"), no N+1 requests,
      single condition in shared component, reversible.
    date: "2026-10-06"
